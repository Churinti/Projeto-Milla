[pytest]
# Os testes vivem em scratch/ (fora da raiz para não colidirem com o código do
# frontend). Sem isto, um `pytest` na raiz tentaria varrer frontend/node_modules.
testpaths = scratch
norecursedirs = frontend chroma_data_milla __pycache__ .git

# Os testes de integração são `async def`. No modo strict o pytest-asyncio exige
# `@pytest.mark.asyncio` em cada um — o repositório nunca marcou, e todos
# falhavam com "async def functions are not natively supported". O modo auto
# roda qualquer teste async automaticamente.
asyncio_mode = auto

# --- Cobertura (pytest-cov) --------------------------------------------------
# A medição roda em TODO `pytest`, local e na CI, para que a cobertura nunca
# saia de vista. A configuração de medição (o que entra, o que é excluído) está
# em .coveragerc.
#
#   --cov                  mede conforme o source do .coveragerc
#   --cov-report=term-missing  imprime o relatório com as linhas não cobertas
#   --cov-fail-under=35    rejeita a execução se a cobertura total cair disso
#
# O piso é propositalmente conservador (a medição atual fica acima dele): ele
# não busca atingir um número, e sim impedir que uma mudança silenciosamente
# derrube testes sem alguém perceber. Para gerar o relatório HTML use
# `python -m pytest --cov-report=html` (o htmlcov/ é ignorado pelo git).
addopts =
    --cov
    --cov-report=term-missing
    --cov-fail-under=35
