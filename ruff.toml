# Ruff — linter de Python do Projeto Milla.
#
# O conjunto de regras está fixado explicitamente em vez de herdar o padrão do
# ruff, para que uma mudança de default numa versão futura não altere o que a
# CI valida:
#
#   E4  — erros de import (imports não no topo, múltiplos imports numa linha)
#   E7  — erros de sintaxe/legibilidade (f-strings sem placeholder, nomes
#         ambíguos como `l`, várias instruções na mesma linha)
#   E9  — erros de sintaxe fatais
#   F   — Pyflakes: imports não usados, variáveis mortas, nomes indefinidos
#
# São regras de *erro*, não de estilo: não há `ruff format` rodando sobre o
# código, e esta configuração não suprime nada. O que a régua apontar é
# corrigido no próprio código.

target-version = "py311"  # o README declara Python 3.11+

[lint]
select = ["E4", "E7", "E9", "F"]
